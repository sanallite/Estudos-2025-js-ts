<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrossel com Swipe usando eventos do ponteiro</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>

<body>
    <div class="container">
        <div class="carousel-wrapper">
            <div class="carousel-container" id="carousel">
                <div class="carousel-track" id="track">
                    <div class="carousel-slide slide-1">Slide 1</div>
                    <div class="carousel-slide slide-2">Slide 2</div>
                    <div class="carousel-slide slide-3">Slide 3</div>
                    <div class="carousel-slide slide-4">Slide 4</div>
                    <div class="carousel-slide slide-5">Slide 5</div>
                </div>
            </div>

            <div class="indicators" id="indicators"></div>

            <div class="info-panel">
                <h3>📊 Debug Info - Acompanhe os eventos em tempo real:</h3>
                <div class="debug-info">
                    <div class="debug-item">
                        <div class="debug-label">Slide Atual:</div>
                        <div class="debug-value" id="currentSlide">1</div>
                    </div>
                    <div class="debug-item">
                        <div class="debug-label">StartX:</div>
                        <div class="debug-value" id="startX">-</div>
                    </div>
                    <div class="debug-item">
                        <div class="debug-label">CurrentX:</div>
                        <div class="debug-value" id="currentX">-</div>
                    </div>
                    <div class="debug-item">
                        <div class="debug-label">Deslocamento:</div>
                        <div class="debug-value" id="displacement">-</div>
                    </div>
                    <div class="debug-item">
                        <div class="debug-label">Direção:</div>
                        <div class="debug-value" id="direction">-</div>
                    </div>
                    <div class="debug-item">
                        <div class="debug-label">Threshold:</div>
                        <div class="debug-value" id="threshold">50px</div>
                    </div>
                    <div class="debug-item">
                        <div class="debug-label">TranslateX:</div>
                        <div class="debug-value" id="translateX">-</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
