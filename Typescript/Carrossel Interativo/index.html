<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrossel de Fotos</title>
    <script type="module" src="app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Pães</h1>
    </header>

    <main>
        <div class="imagem">
            <img src="">

            <div class="linhaFundo">
                <div class="linhaFrente"></div>
            </div>

            <div>
                <p class="estado" hidden></p>
            </div>
        </div>

        <div class="botoes">
            <button class="play">Play</button>
            <button class="pause" disabled='true'>Pause</button>
            <button class="anterior">Anterior</button>
            <button class="proxima">Próxima</button>
        </div>
    </main>
</body>
</html>
